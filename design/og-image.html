<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background:
            radial-gradient(800px 480px at 100% 110%, rgba(109, 93, 252, .45), transparent 60%),
            radial-gradient(600px 400px at 0% 0%, rgba(109, 93, 252, .14), transparent 60%),
            #0a0a0f;
        color: #e4e4ee;
        font-family: "JetBrains Mono", Consolas, monospace;
        padding: 72px 80px;
        display: flex; flex-direction: column;
    }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 30px; font-weight: 700; color: #fff; }
    .logo span { color: #8b7cf6; }
    .status {
        font-size: 22px; color: #34d399; padding: 8px 18px; border-radius: 99px;
        background: rgba(52, 211, 153, .1); border: 1px solid rgba(52, 211, 153, .35);
    }
    .status::before { content: "● "; }
    h1 { margin-top: 70px; font-size: 76px; line-height: 1.15; font-weight: 600; letter-spacing: -1px; color: #fff; }
    h1 .kw { color: #a3a3b8; font-weight: 400; }
    h1 .var { color: #a295f9; }
    .role { margin-top: 26px; font-size: 34px; color: #e4e4ee; }
    .role .c { color: #8686a0; }
    .stack {
        margin-top: auto; display: flex; gap: 14px; flex-wrap: wrap;
        font-size: 22px;
    }
    .stack span {
        padding: 8px 16px; border-radius: 8px; color: #a295f9;
        background: rgba(139, 124, 246, .15);
    }
</style>
</head>
<body>
    <div class="top">
        <div class="logo"><span>&gt;_</span> sozakbay.dev</div>
        <div class="status">open to work</div>
    </div>
    <h1><span class="kw">var</span> <span class="var">developer</span> <span class="kw">=</span><br />"Yeldos Sozakbay"<span class="kw">;</span></h1>
    <p class="role"><span class="c">//</span> C#/.NET Developer · Backend · Astana</p>
    <div class="stack">
        <span>C#</span><span>.NET</span><span>PostgreSQL</span><span>MS SQL</span><span>Kafka</span><span>Docker</span>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: #ffffff;
        color: #1d1d1f;
        font-family: -apple-system, "SF Pro Display", "Inter", sans-serif;
        padding: 72px 80px;
        display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center;
    }
    .status { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; color: #1a8f3c; }
    .status i { width: 12px; height: 12px; border-radius: 50%; background: #1a8f3c; box-shadow: 0 0 0 5px rgba(26, 143, 60, .18); }
    .eyebrow { margin-top: 34px; font-size: 32px; font-weight: 600; color: #515154; }
    h1 { margin-top: 10px; font-size: 92px; line-height: 1.02; font-weight: 700; letter-spacing: -3.2px; }
    .site { margin-top: 34px; display: inline-flex; padding: 12px 26px; border-radius: 980px; background: #0071e3; color: #fff; font-size: 26px; font-weight: 500; }
    .window { border-radius: 18px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .06); }
    .bar { position: relative; display: flex; align-items: center; height: 46px; padding: 0 18px; background: #ececee; box-shadow: inset 0 -1px 0 rgba(60, 60, 67, .18); }
    .bar i { width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; background: #ff5f57; }
    .bar i:nth-child(2) { background: #febc2e; }
    .bar i:nth-child(3) { background: #28c840; }
    .bar span { position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 600; color: #6e6e73; }
    pre { padding: 24px 26px; background: #fff; font: 19px/1.75 "JetBrains Mono", monospace; color: #1d1d1f; }
    .k { color: #0b57b8; } .s { color: #b2401a; }
</style>
</head>
<body>
    <div>
        <div class="status"><i></i>Open to work</div>
        <p class="eyebrow">C#/.NET Developer · Backend</p>
        <h1>Yeldos<br />Sozakbay</h1>
        <div class="site">sozakbay.dev</div>
    </div>
    <div class="window">
        <div class="bar"><i></i><i></i><i></i><span>developer.xml</span></div>
        <pre><span class="k">&lt;developer&gt;</span>
  <span class="k">&lt;location&gt;</span><span class="s">Astana</span><span class="k">&lt;/location&gt;</span>
  <span class="k">&lt;skills&gt;</span>
    <span class="k">&lt;skill&gt;</span><span class="s">C#</span><span class="k">&lt;/skill&gt;</span>
    <span class="k">&lt;skill&gt;</span><span class="s">.NET</span><span class="k">&lt;/skill&gt;</span>
    <span class="k">&lt;skill&gt;</span><span class="s">PostgreSQL</span><span class="k">&lt;/skill&gt;</span>
    <span class="k">&lt;skill&gt;</span><span class="s">Kafka</span><span class="k">&lt;/skill&gt;</span>
  <span class="k">&lt;/skills&gt;</span>
<span class="k">&lt;/developer&gt;</span></pre>
    </div>
</body>
</html>
